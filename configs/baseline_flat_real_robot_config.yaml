# ==============================================================================
# Baseline controller config — flat surface, sinusoidal trajectory
# ==============================================================================

controller:
  size_z:    0.0001
  slope_pos: [0.5205, -0.0059, 0.036]
  euler:     [0.0, 0.0, 0.0]           # flat surface (no slope)
  dt:                   0.001
  gravity_compensation: true
  motion_duration:      10.0
  position_tolerance:   0.01
  use_table:            false

trajectory:
  type:      "sinusoidal"
  start_pos: [0.4961, 0.0038, 0.0524]
  amplitude: 0.04   # half-amplitude [m]
  frequency: 0.2    # [Hz]
