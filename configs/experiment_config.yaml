# ==============================================================================
# Unified Experiment Configuration
# ==============================================================================
# This file is the single source of truth for one training run.
# Edit the values here; the training script, ControllerConfig, and
# HybridControllerConfig all read from this file.
#
# Usage:
#   python -m ppo_friction_compensation.train_ppo --config configs/experiment_config.yaml
# ==============================================================================

# Optional human-readable label for this experiment.
# If omitted, a timestamped name is generated automatically.
experiment_name: null   # e.g. "fr3_sinusoidal_seed0"

# Root directory under which the experiment folder is created.
experiments_base_dir: "experiments"

# ==============================================================================
# Training hyperparameters
# ==============================================================================
training:
  robot_type:       "fr3"   # "fr3" | "kuka" | "panda"
  seed:             0
  epochs:           200
  steps_per_epoch:  4000
  gamma:            0.99    # Discount factor
  lam:              0.97    # GAE lambda
  clip_ratio:       0.2     # PPO clipping epsilon
  pi_lr:            3.0e-4  # Actor learning rate
  vf_lr:            1.0e-3  # Critic learning rate
  train_pi_iters:   80      # Actor gradient steps per epoch
  train_v_iters:    80      # Critic gradient steps per epoch
  target_kl:        0.01    # Early-stop KL threshold
  save_every:       10      # Save checkpoint every N epochs

# ==============================================================================
# ControllerConfig
# Shared parameters used by the hybrid controller and the environment.
# ==============================================================================
controller:
  dt:                   0.001   # Timestep [s] (used for plotting only)
  gravity_compensation: true

  # Trajectory / motion parameters
  circle_center:    [0.5038, 0.0108, 0.0857]  # World-frame reference point [m]
  circle_radius:    0.05    # Used for circle trajectory and as line end-point offset [m]
  circle_duration:  1000.0  # Motion runs until this elapsed time [s]; set large to run continuously
  angular_speed:    3.14159265  # [rad/s] — used by circle trajectory

  # Active trajectory type: "sinusoidal" | "circle" | "line"
  trajectory_type:        "sinusoidal"
  sinusoidal_amplitude:   0.04   # Half-amplitude [m] (total swing = 2×amplitude)
  sinusoidal_frequency:   2.0    # [Hz]

  # Contact detection
  position_tolerance: 0.01   # [m]

  # Constraint / surface geometry
  euler:     [0.0, 0.0, 0.0]  # Surface orientation as roll-pitch-yaw [rad]
  size_z:    0.0001            # Height offset on the surface [m]
  use_table: false

# ==============================================================================
# HybridControllerConfig
# Force-impedance controller gains.
# NOTE: Kp, Kd, and Kd_null are derived automatically from the values below
#       and are therefore intentionally absent from this file.
# ==============================================================================
hybrid_controller:
  Kpos:          0.95   # Position error scale factor
  Kori:          0.95   # Orientation error scale factor
  damping_ratio: 1.0    # Damping ratio for all derived Kd terms

  # Cartesian impedance stiffness
  impedance_pos: [100.0, 100.0, 100.0]   # Translational [N/m]
  impedance_ori: [50.0,  50.0,  50.0]    # Rotational [Nm/rad]

  # Nullspace joint stiffness
  Kp_null: [75.0, 75.0, 50.0, 50.0, 40.0, 25.0, 25.0]

  # Force control gains
  Kp_force: 0.4
  Kd_force: 0.002
  Ki_force: 0.4

  F_desired_contact: [-8.0]   # Desired normal contact force [N]; negative = push into surface
  max_delta_tau:     1.0      # Max torque change per timestep [Nm]

# ==============================================================================
# Trajectory overrides
# Fine-grained parameters for the chosen trajectory type.
# Values here take precedence over the matching controller fields above.
# Only the fields relevant to the active trajectory_type need to be set.
# ==============================================================================
trajectory:
  # type overrides controller.trajectory_type if set
  type: "sinusoidal"

  # -- Sinusoidal --
  amplitude:  0.04   # [m]
  frequency:  2.0    # [Hz]

  # -- Circle --
  # (uses circle_center, circle_radius, angular_speed from controller section)

  # -- Line --
  # start_pos: [0.5038, 0.0108, 0.0857]   # defaults to circle_center
  # end_pos:   [0.5538, 0.0108, 0.0857]   # defaults to circle_center + [radius, 0, 0]
  duration:   5.0    # [s] — only used for "line" trajectory
