# ==============================================================================
# PPO Evaluation Configuration
# ==============================================================================
# Single source of truth for one evaluation run.
# Deliberately separate from experiment_config.yaml — no training hyperparameters
# (no epochs, learning rates, or rollout buffer settings) live here.
#
# Usage:
#   python ppo_friction_compensation/run_ppo_eval.py --config configs/eval_config.yaml
#   python ppo_friction_compensation/run_ppo_eval.py --config configs/eval_config.yaml --viewer
# ==============================================================================

# ==============================================================================
# Model
# Which checkpoint to load and how to run it.
# ==============================================================================
model:
  checkpoint: "ppo_checkpoints/final"   # Path prefix — loads <checkpoint>_{actor,critic}.pt
                                         #   and <checkpoint>_normalizer.npz
  robot:      "fr3"                      # "fr3" | "kuka" | "panda"
  ppo_active: true                       # false → baseline (hybrid controller only, no PPO)

# ==============================================================================
# Episode
# Runtime parameters for the evaluation rollout.
# ==============================================================================
episode:
  duration_s: 10.0     # How long the episode runs [s]
  f_desired:  -8.0     # Desired normal contact force [N]; negative = push into surface

# ==============================================================================
# Output
# Where to save plots and whether to open the MuJoCo viewer.
# ==============================================================================
output:
  plots_dir: "ppo_eval_plots"   # Directory for saved PNG plots
  viewer:    false               # true = launch interactive MuJoCo viewer
                                 # false = headless (required on remote machines)

# ==============================================================================
# Weights & Biases
# Set project to enable cloud logging.  Leave null to disable.
# ==============================================================================
wandb:
  project:  null   # e.g. "mj_ctrl_ppo" — set to enable W&B logging
  entity:   null   # W&B username or team; null = use your default entity
  run_name: null   # Human-readable run label; null = auto-generated from checkpoint + mode
